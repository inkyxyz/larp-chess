<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Шахматное Ателье</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<svg style="display:none" xmlns="http://www.w3.org/2000/svg">
  <symbol id="pc-pawn" viewBox="0 0 40 40">
    <circle cx="20" cy="12" r="5.5"/>
    <path d="M 14 19 Q 20 22 26 19 L 28.5 29 L 11.5 29 Z"/>
    <rect x="9" y="29" width="22" height="6" rx="2"/>
  </symbol>
  <symbol id="pc-rook" viewBox="0 0 40 40">
    <path d="M 9 8 L 9 13 L 12 13 L 12 11 L 16 11 L 16 13 L 19 13 L 19 11 L 21 11 L 21 13 L 24 13 L 24 11 L 28 11 L 28 13 L 31 13 L 31 8 Z"/>
    <path d="M 12 13 L 12 29 L 28 29 L 28 13 Z"/>
    <rect x="9" y="29" width="22" height="6" rx="2"/>
  </symbol>
  <symbol id="pc-knight" viewBox="0 0 40 40">
    <path d="M 12 35 L 12 30 C 12 25 15 22 19 21 L 19 17 L 15 17 L 16 12 C 18 9 22 8 25 8 L 27 5 L 28 9 Q 31 13 31 20 L 31 30 L 33 30 L 33 35 Z"/>
  </symbol>
  <symbol id="pc-bishop" viewBox="0 0 40 40">
    <circle cx="20" cy="7" r="2.5"/>
    <path d="M 20 11 Q 13 18 13 24 Q 13 28 20 29 Q 27 28 27 24 Q 27 18 20 11 Z"/>
    <rect x="9" y="29" width="22" height="6" rx="2"/>
  </symbol>
  <symbol id="pc-queen" viewBox="0 0 40 40">
    <circle cx="8" cy="11" r="2"/>
    <circle cx="14" cy="7" r="2"/>
    <circle cx="20" cy="5" r="2.5"/>
    <circle cx="26" cy="7" r="2"/>
    <circle cx="32" cy="11" r="2"/>
    <path d="M 8 13 L 11 29 L 29 29 L 32 13 L 26 20 L 20 12 L 14 20 Z"/>
    <rect x="9" y="29" width="22" height="6" rx="2"/>
  </symbol>
  <symbol id="pc-king" viewBox="0 0 40 40">
    <path class="stroke-only" d="M 20 3 L 20 10 M 16 6.5 L 24 6.5"/>
    <path d="M 13 29 L 13 15 Q 16 12 20 10.5 Q 24 12 27 15 L 27 29 Z"/>
    <rect x="9" y="29" width="22" height="6" rx="2"/>
  </symbol>

  <symbol id="cls-brilliant" viewBox="0 0 24 24">
    <path d="M12 2 L14 9 L21 10 L15.5 14.5 L17.5 21 L12 17 L6.5 21 L8.5 14.5 L3 10 L10 9 Z" fill="currentColor"/>
  </symbol>
  <symbol id="cls-best" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2.5"/>
    <circle cx="12" cy="12" r="4" fill="currentColor"/>
  </symbol>
  <symbol id="cls-excellent" viewBox="0 0 24 24">
    <path d="M5 12 L10 17 L19 6" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>
  <symbol id="cls-good" viewBox="0 0 24 24">
    <path d="M6 12 L11 17 L18 8" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>
  <symbol id="cls-inaccuracy" viewBox="0 0 24 24">
    <path d="M12 3 L22 20 L2 20 Z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/>
    <path d="M12 10 L12 14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    <circle cx="12" cy="17" r="1" fill="currentColor"/>
  </symbol>
  <symbol id="cls-mistake" viewBox="0 0 24 24">
    <path d="M12 3 L22 20 L2 20 Z" fill="currentColor"/>
    <path d="M12 9 L12 14" stroke="#fdfaf5" stroke-width="2.2" stroke-linecap="round"/>
    <circle cx="12" cy="17" r="1.2" fill="#fdfaf5"/>
  </symbol>
  <symbol id="cls-blunder" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="9" fill="currentColor"/>
    <path d="M8 8 L16 16 M16 8 L8 16" stroke="#fdfaf5" stroke-width="2.5" stroke-linecap="round"/>
  </symbol>
  <symbol id="cls-book" viewBox="0 0 24 24">
    <path d="M5 4 L5 19 Q 8.5 17 12 19 Q 15.5 17 19 19 L 19 4 Q 15.5 2 12 4 Q 8.5 2 5 4 Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
    <path d="M12 4 L12 19" stroke="currentColor" stroke-width="1.5"/>
  </symbol>
</svg>

<div class="app">
  <header class="header">
    <h1 class="title">Шахматное <span class="title-accent">Ателье</span></h1>
    <p class="subtitle">Тихие шахматы с мягкими движениями</p>
  </header>

  <main class="main">
    <section class="board-area">
      <div class="eval-wrap">
        <div class="eval-bar"><div class="eval-fill" id="evalFill"></div></div>
        <div class="eval-text" id="evalText">+0.0</div>
      </div>

      <div class="board-wrap">
        <div class="board" id="board"></div>
        <canvas class="fx" id="fx"></canvas>
        <div class="hint" id="hint"></div>
        <div class="game-over" id="gameOver" hidden>
          <div class="game-over-card">
            <div class="game-over-text" id="gameOverText"></div>
            <button class="btn btn-primary" id="gameOverNew">Новая партия</button>
          </div>
        </div>
      </div>
    </section>

    <aside class="panel">
      <section class="card">
        <h2 class="card-title">Последний ход</h2>
        <div class="last-move" id="lastMove">
          <span class="muted">Сделайте ход, чтобы увидеть разбор</span>
        </div>
      </section>

      <section class="card">
        <h2 class="card-title">История партии</h2>
        <div class="history" id="history">
          <span class="muted">Пока пусто</span>
        </div>
      </section>

      <section class="card">
        <h2 class="card-title">Оформление</h2>
        <div class="themes">
          <button class="theme-btn active" data-theme="warm">Тёплая</button>
          <button class="theme-btn" data-theme="sage">Шалфей</button>
          <button class="theme-btn" data-theme="dusk">Сумрак</button>
        </div>
        <div class="actions">
          <button class="btn" id="flipBtn">Перевернуть</button>
          <button class="btn btn-primary" id="newBtn">Новая партия</button>
        </div>
      </section>
    </aside>
  </main>
</div>

<div class="promotion" id="promotion" hidden>
  <div class="promotion-card">
    <h3>Выберите фигуру</h3>
    <div class="promotion-options" id="promotionOptions"></div>
  </div>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
